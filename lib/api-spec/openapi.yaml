openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: billing
    description: Plan access and entitlements
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /billing/plans:
    get:
      operationId: listBillingPlans
      tags: [billing]
      summary: List available demo plans
      responses:
        "200":
          description: Available billing plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      $ref: "#/components/schemas/BillingPlan"
                required: [plans]
  /billing/subscription:
    get:
      operationId: getBillingSubscription
      tags: [billing]
      summary: Get the authenticated user's plan and entitlements
      responses:
        "200":
          description: Current subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSubscription"
        "401":
          description: Unauthorized
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BillingPlan:
      type: object
      properties:
        plan:
          type: string
          enum: [pro, pro_plus]
        name:
          type: string
        description:
          type: string
        prices:
          type: object
          properties:
            monthly:
              $ref: "#/components/schemas/BillingPrice"
            annual:
              $ref: "#/components/schemas/BillingPrice"
          required: [monthly, annual]
      required: [plan, name, description, prices]
    BillingPrice:
      type: object
      properties:
        amount:
          type: integer
        currency:
          type: string
      required: [amount, currency]
    BillingSubscription:
      type: object
      properties:
        plan:
          type: string
          enum: [free, pro, pro_plus]
        billingCycle:
          type: string
          enum: [monthly, annual]
        status:
          type: string
          enum: [free, trialing, active, past_due, canceled, unpaid, incomplete, paused]
        currentPeriodEnd:
          type: [string, "null"]
          format: date-time
        cancelAtPeriodEnd:
          type: boolean
        entitlements:
          type: array
          items:
            type: string
      required:
        - plan
        - billingCycle
        - status
        - currentPeriodEnd
        - cancelAtPeriodEnd
        - entitlements
    BillingRedirect:
      type: object
      properties:
        url:
          type: string
          format: uri
      required: [url]

